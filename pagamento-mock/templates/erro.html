    <style>
        :root {
            --primary-color: #4B2E21;
            --secondary-color: #F2E6B3;
            --font-family: "Poppins", sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: var(--primary-color);
            color: var(--primary-color);
            font-family: var(--font-family);
        }

        main {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        section {
            width: 100%;
            max-width: 450px;
            padding: 35px;
            border-radius: 20px;
            background-color: var(--secondary-color);
            text-align: center;
        }

        .error-code {
            margin: 0;
            font-size: 3rem;
            font-weight: 700;
        }

        h1 {
            margin: 5px 0 15px;
            font-size: 1.5rem;
            font-weight: 500;
        }

        p {
            margin-bottom: 25px;
            overflow-wrap: anywhere;
        }

        button {
            padding: 10px 24px;
            border: none;
            border-radius: 20px;
            background-color: var(--primary-color);
            color: var(--secondary-color);
            font-family: var(--font-family);
            font-size: 1rem;
            cursor: pointer;
            transition: filter 0.2s ease-in-out;
        }

        button:hover {
            filter: brightness(1.3);
        }
    </style>
</head>
