<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock do Pagamento</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <style>
        :root { --primary-color: #4B2E21; --secondary-color: #F2E6B3; }
        body { background-color: var(--primary-color); color: var(--primary-color); margin: 0; }
        main { display: flex; align-items: center; justify-content: center; height: 100vh; }
        section { background-color: var(--secondary-color); padding: 20px; border-radius: 20px; }
        h1 { margin: 0; }
        p { font-weight: 700; }
        form { display: flex; justify-content: center; gap: 20px; }
        button:hover { filter: brightness(0.75); }
        button {
            background-color: var(--primary-color);
            color: var(--secondary-color);
            border: none;
            cursor: pointer;
            transition: filter 0.2s ease-in-out;

            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px 20px;
        }

        #btn-recusar { background-color: #CC0000; }
        #btn-aprovar { background-color: #007D00; }
    </style>
</head>

<body>
    <main>
        <section>
            <h1>Pagamento</h1>
            <p>Você está pagando um total de: R${{ "%0.2f" | format(valor | float) }}</p>
            <form action="/pagamento/{{ pedido_id }}">
                <button type="submit" name="action" value="recusar" id="btn-recusar">
                    Recusar
                </button>
                <button type="submit" name="action" value="aprovar" id="btn-aprovar">
                    Aprovar
                </button>
            </form>
        </section>
    </main>
</body>

</html>
