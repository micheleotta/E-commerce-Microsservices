<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bakery E-commerce</title>
    <link rel="icon" href="/favicon.ico?v=2" type="image/x-icon">

    <link rel="stylesheet" href="/bootstrap-grid.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=campaign,remove,add,close,unsubscribe,mark_email_read,shopping_cart,attach_money,notification_important,login,logout" />
    
    <script src="/js/login.js"></script>
    <script src="/js/produtos.js"></script>
    <script src="/js/promocoes.js"></script>
    <link rel="stylesheet" href="/styles.css">
</head>

<div id="cart-feedback" class="cart-feedback" role="status" aria-live="polite"></div>

<body>
    <header class="container">
        <div class="header-container">
            <div class="logo-container">
            <img src="/baker.png" alt="Logo Sylvanian Bakery" class="logo">
            <h1>Sylvanian Bakery</h1>
            </div>

            <div class="header-right">
                <nav class="nav">
                    <ul>
                        <li><a href="#">Início</a></li>
                        <li>
                            <button onclick="abrirPromo()">Promoções</button>
                            <dialog id="promo-dialog" class="dialog">
                                <div class="dialog-header">
                                    <h3>Promoções</h3>
                                    <button class="btn-icon" type="reset" onclick="document.getElementById('promo-dialog').close()">
                                        <span class="material-symbols-outlined">close</span>
                                    </button>
                                </div>
                                <p>Receba nossas promoções!</p>
                                <form method="dialog">
                                    <section>
                                        <div>
                                            <label for="email">E-mail:</label>
                                            <input type="email" id="email" name="email" required>
                                        </div>

                                        <div>
                                            <label for="categoria">Categoria:</label>
                                            <select id="categoria" name="categoria" required>
                                                <option value="">Selecione uma categoria</option>
                                            </select>
                                        </div>
                                    </section>
                                    <menu>
                                        <button onclick="removerInteresse()" id="remove-btn" type="submit" class="btn-icon">
                                            <span class="material-symbols-outlined">unsubscribe</span>
                                        </button>
                                        <button onclick="informarInteresse()" id="submit-btn" type="submit" class="btn-icon">
                                            <span class="material-symbols-outlined">mark_email_read</span>
                                        </button>
                                    </menu>
                                </form>
                            </dialog>
                        </li>
                    </ul>
                </nav>
                <div>
                    <button id="pedido-btn" onclick="document.getElementById('pedido-dropdown').classList.toggle('open')" class="btn-icon" data-count="0">
                        <span class="material-symbols-outlined">campaign</span>
                    </button>
                    <div id="pedido-dropdown" class="dropdown">
                        <div id="pedido-container">
                            <div id="sem-pedidos" class="pedido-content">
                                <p style="margin: auto;">Ainda não há nenhuma atualização de pedidos.</p>
                            </div>
                        </div>
                    </div>
                </div>
                <button id="cart-btn" class="btn-icon" onclick="carrinho.abrir()" data-count="0">
                    <span class="material-symbols-outlined">shopping_cart</span>
                </button>
                <button id="logout-btn" class="btn-icon" onclick="logout()" style="display: none;">
                    <span class="material-symbols-outlined">logout</span>
                </button>
                <button id="login-btn" class="btn-icon" onclick="document.getElementById('login-dialog').showModal()">
                    <span class="material-symbols-outlined">login</span>
                </button>
                <dialog id="login-dialog" class="dialog">
                    <div class="dialog-header">
                        <h3>Login</h3>
                        <button class="btn-icon" type="reset" onclick="document.getElementById('login-dialog').close()">
                            <span class="material-symbols-outlined">close</span>
                        </button>
                    </div>
                    <form method="dialog">
                        <section>
                            <div>
                                <label for="email-login">E-mail:</label>
                                <input type="email" id="email-login" name="email-login" required>
                            </div>
                        </section>
                        <menu>
                            <button onclick="login()" type="submit" class="btn">
                                Login
                            </button>
                        </menu>
                    </form>
                </dialog>
            </div>
        </div>
    </header>

    <button id="backdrop" onclick="carrinho.fechar()"></button>
    <div id="carrinho" class="sidebar">
        <div class="cart-header">
            <h2>Seu Carrinho</h2>
        </div>
        <div id="cart-container"></div>
        <div class="cart-footer">
            <div class="total-container">
                <p>Total</p>
                <span id="total-price">R$0.00</span>
            </div>
            <button onclick="fazerPedido()" class="btn">
                Comprar
                <span class="material-symbols-outlined">attach_money</span>
            </button>
        </div>
    </div>

    <main class="container">
        <section id="product-list" class="row">
            <h2 class="col-12">Produtos</h2>
            <div class="produto col-md-4">
                <div class="produto-card">
                    <div class="produto-info">
                        <h3>${produto.nome}</h3>
                        <p>R$${produto.preco.toFixed(2)}</p>
                    </div>
                    <div class="produto-footer">
                        <button onclick="removeProduto(0)" class="btn-icon btn-remove">
                            <span class="material-symbols-outlined">remove</span>
                        </button>
                        <button onclick="addProduto(0)" class="btn-icon btn-add">
                            <span class="material-symbols-outlined">add</span>
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
