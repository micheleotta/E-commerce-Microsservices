<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bakery E-commerce</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <link rel="stylesheet" href="/bootstrap-grid.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mali:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=campaign,remove,add,close,unsubscribe,mark_email_read" />
    
    <script src="/js/produtos.js"></script>
    <link rel="stylesheet" href="/styles.css">
</head>

<body>
    <header class="container">
        <div class="header-container">
            <h1>Sylvanian Bakery</h1>
            <div class="header-right">
                <nav class="nav">
                    <ul>
                        <li><a href="#">Início</a></li>
                        <li>
                            <button onclick="document.getElementById('promo-dialog').showModal()">Promoções</button>
                            <dialog id="promo-dialog">
                                <div class="dialog-header">
                                    <h3>Promoções</h3>
                                    <button class="btn" type="reset" onclick="document.getElementById('promo-dialog').close()">
                                        <span class="material-symbols-outlined">close</span>
                                    </button>
                                </div>
                                <p>Receba nossas promoções!</p>
                                <form method="dialog">
                                    <section>
                                        <label for="email">E-mail:</label>
                                        <input type="email" id="email" name="email" required>
                                    </section>
                                    <menu>
                                        <button id="remove-btn" type="submit" class="btn">
                                            <span class="material-symbols-outlined">unsubscribe</span>
                                        </button>
                                        <button id="submit-btn" type="submit" class="btn">
                                            <span class="material-symbols-outlined">mark_email_read</span>
                                        </button>
                                    </menu>
                                </form>
                            </dialog>
                        </li>
                    </ul>
                </nav>
                <button class="btn btn-campaign">
                    <span class="material-symbols-outlined">campaign</span>
                </button>
            </div>
        </div>
    </header>

    <main class="container">
        <section id="product-list" class="row">
            <h2>Produtos</h2>
            <div class="produto col-md-4">
                <div class="produto-card">
                    <div class="produto-info">
                        <h3>${produto.nome}</h3>
                        <p>R$${produto.preco.toFixed(2)}</p>
                    </div>
                    <div class="produto-footer">
                        <button onclick="removeProduto(0)" class="btn btn-remove">
                            <span class="material-symbols-outlined">remove</span>
                        </button>
                        <button onclick="addProduto(0)" class="btn btn-add">
                            <span class="material-symbols-outlined">add</span>
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
