<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desconto Especial na Padaria!</title>
    <style>
        /* Estilos gerais para garantir a compatibilidade no Gmail */
        body {
            margin: 0;
            padding: 0;
            background-color: #fcf8f2;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #5a4a42;
        }
        table {
            border-collapse: collapse;
        }
        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .header {
            background-color: #ffebd6;
            padding: 30px 20px;
            text-align: center;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #b17a5c;
            margin: 0;
            text-align: center;
        }
        .banner-img {
            width: 40%;
            max-width: 240px;
            height: auto;
            display: block;
            margin: 0 auto;
        }
        .content {
            padding: 20px 30px;
            text-align: center;
        }
        .headline {
            font-size: 26px;
            color: #8c5333;
            margin: 0 0 20px 0;
            line-height: 1.3;
        }
        .highlight {
            color: #d96b43;
        }
        .text {
            font-size: 16px;
            line-height: 1.6;
            color: #6e5d55;
            margin-bottom: 30px;
        }
        .btn {
            background-color: #d96b43;
            color: #ffffff !important;
            text-decoration: none;
            padding: 15px 35px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            display: inline-block;
            transition: background-color 0.3s ease;
            box-shadow: 0 4px 6px rgba(217, 107, 67, 0.2);
        }
        .footer {
            background-color: #f7ede2;
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #a39085;
        }
    </style>
</head>
<body>

    <table width="100%" cellspacing="0" cellpadding="0" border="0" bgcolor="#fcf8f2" style="padding: 20px 0;">
        <tr>
            <td>
                <!-- Caixa Principal do E-mail -->
                <table class="container" cellspacing="0" cellpadding="0" border="0" align="center">
                    
                    <!-- Cabeçalho / Logo -->
                    <tr>
                        <td class="header" align="center" style="text-align: center; padding: 30px 20 px;">
                            <div class="logo" style="text-align:center; margin:0;">{emoji} Sylvanian Bakery</div>
                        </td>
                    </tr>
                    
                    <!-- Imagem Fofa (Ilustração de pães/doces felizes) -->
                    <tr>
                        <td align="center" style="padding-top: 15px; padding-bottom: 0;">
                            <img src="https://raw.githubusercontent.com/micheleotta/E-commerce-Microsservices/main/front-end/sylvanian.png" alt="sylvanian bakery" class="banner-img" width="240">
                        </td>
                    </tr>
                    
                    <!-- Conteúdo Principal -->
                    <tr>
                        <td class="content">
                            <h1 class="headline">
                                Uma novidade quentinha para você! <br>
                                <strong>{produto} está com <span class="highlight">{desconto}%</span> de desconto!</strong>
                            </h1>
                            <p class="text">
                                Preparamos uma fornada especial com um preço ainda mais doce {emoji} Venha aproveitar os seus favoritos da nossa categoria de {categoria} antes que acabe!
                            </p>
                        </td>
                    </tr>
                    
                    <!-- Rodapé -->
                    <tr>
                        <td class="footer">
                            <p>© 2026 Sylvanian bakery</p>
                        </td>
                    </tr>
                    
                </table>
            </td>
        </tr>
    </table>

</body>
</html>
